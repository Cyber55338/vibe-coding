<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        #tetris-canvas {
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            min-width: 200px;
        }

        .info-box h2 {
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
        }

        .stat-label {
            font-weight: bold;
        }

        .stat-value {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            min-width: 60px;
            text-align: center;
        }

        #next-piece-canvas {
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            background: #000;
            margin: 15px auto;
            display: block;
        }

        .controls {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .controls h3 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .key {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .game-over.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .game-over h2 {
            font-size: 48px;
            color: #ff4757;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 24px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
                gap: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .side-panel {
                flex-direction: row;
                width: 100%;
            }

            .info-box, .controls {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <h1>🎮 TETRIS</h1>
            <canvas id="tetris-canvas" width="300" height="600"></canvas>
            <div class="button-group">
                <button id="start-btn" onclick="startGame()">Start Game</button>
                <button id="pause-btn" onclick="togglePause()" disabled>Pause</button>
                <button id="restart-btn" onclick="restartGame()">Restart</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="info-box">
                <h2>Statistics</h2>
                <div class="stat">
                    <span class="stat-label">Score:</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Lines:</span>
                    <span class="stat-value" id="lines">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Level:</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <h2 style="margin-top: 20px;">Next Piece</h2>
                <canvas id="next-piece-canvas" width="120" height="120"></canvas>
            </div>

            <div class="controls">
                <h3>⌨️ Controls</h3>
                <div class="control-row">
                    <span>Move Left:</span>
                    <span class="key">←</span>
                </div>
                <div class="control-row">
                    <span>Move Right:</span>
                    <span class="key">→</span>
                </div>
                <div class="control-row">
                    <span>Rotate:</span>
                    <span class="key">↑</span>
                </div>
                <div class="control-row">
                    <span>Soft Drop:</span>
                    <span class="key">↓</span>
                </div>
                <div class="control-row">
                    <span>Hard Drop:</span>
                    <span class="key">Space</span>
                </div>
                <div class="control-row">
                    <span>Pause:</span>
                    <span class="key">P</span>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over" id="game-over">
        <h2>GAME OVER</h2>
        <div class="final-score">
            Final Score: <span id="final-score">0</span>
        </div>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('tetris-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece-canvas');
        const nextCtx = nextCanvas.getContext('2d');

        // Game constants
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;
        const COLORS = [
            null,
            '#FF0D72', // I
            '#0DC2FF', // J
            '#0DFF72', // L
            '#F538FF', // O
            '#FF8E0D', // S
            '#FFE138', // T
            '#3877FF'  // Z
        ];

        // Tetromino shapes
        const SHAPES = [
            [], // Empty
            [[1,1,1,1]], // I
            [[1,0,0],[1,1,1]], // J
            [[0,0,1],[1,1,1]], // L
            [[1,1],[1,1]], // O
            [[0,1,1],[1,1,0]], // S
            [[0,1,0],[1,1,1]], // T
            [[1,1,0],[0,1,1]]  // Z
        ];

        // Game state
        let board = [];
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop = null;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        // Current piece
        let currentPiece = {
            shape: [],
            color: 0,
            x: 0,
            y: 0
        };

        let nextPiece = {
            shape: [],
            color: 0
        };

        // Initialize board
        function createBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        }

        // Draw a single block
        function drawBlock(ctx, x, y, color) {
            ctx.fillStyle = COLORS[color];
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

            // Add shine effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE / 3);
        }

        // Draw the board
        function drawBoard() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        drawBlock(ctx, col, row, board[row][col]);
                    }
                }
            }
        }

        // Draw current piece
        function drawPiece(piece, offsetX = 0, offsetY = 0, context = ctx) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(context, piece.x + x + offsetX, piece.y + y + offsetY, piece.color);
                    }
                });
            });
        }

        // Draw next piece preview
        function drawNextPiece() {
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            const size = 20;
            const offsetX = (nextCanvas.width / size - nextPiece.shape[0].length) / 2;
            const offsetY = (nextCanvas.height / size - nextPiece.shape.length) / 2;

            nextPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        nextCtx.fillStyle = COLORS[nextPiece.color];
                        nextCtx.fillRect((offsetX + x) * size, (offsetY + y) * size, size, size);
                        nextCtx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                        nextCtx.lineWidth = 1;
                        nextCtx.strokeRect((offsetX + x) * size, (offsetY + y) * size, size, size);
                    }
                });
            });
        }

        // Create new piece
        function createPiece() {
            const type = Math.floor(Math.random() * 7) + 1;
            return {
                shape: SHAPES[type].map(row => [...row]),
                color: type,
                x: Math.floor(COLS / 2) - Math.floor(SHAPES[type][0].length / 2),
                y: 0
            };
        }

        // Check collision
        function collide(piece, offsetX = 0, offsetY = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }

                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Merge piece to board
        function merge() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const boardY = currentPiece.y + y;
                        const boardX = currentPiece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                });
            });
        }

        // Rotate piece
        function rotate(piece) {
            const rotated = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );

            const previousShape = piece.shape;
            piece.shape = rotated;

            // Wall kick
            let offset = 0;
            while (collide(piece, offset, 0)) {
                offset = offset > 0 ? -(offset + 1) : -offset + 1;
                if (Math.abs(offset) > piece.shape[0].length) {
                    piece.shape = previousShape;
                    return;
                }
            }
            piece.x += offset;
        }

        // Clear lines
        function clearLines() {
            let linesCleared = 0;

            outer: for (let row = ROWS - 1; row >= 0; row--) {
                for (let col = 0; col < COLS; col++) {
                    if (!board[row][col]) {
                        continue outer;
                    }
                }

                // Remove line
                board.splice(row, 1);
                board.unshift(Array(COLS).fill(0));
                linesCleared++;
                row++; // Check same row again
            }

            if (linesCleared > 0) {
                lines += linesCleared;
                // Scoring: 100, 300, 500, 800 for 1, 2, 3, 4 lines
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;

                // Level up every 10 lines
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);

                updateStats();
            }
        }

        // Update statistics display
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;
        }

        // Move piece down
        function drop() {
            if (collide(currentPiece, 0, 1)) {
                merge();
                clearLines();

                currentPiece = nextPiece;
                nextPiece = createPiece();
                drawNextPiece();

                if (collide(currentPiece, 0, 0)) {
                    gameOver();
                }
            } else {
                currentPiece.y++;
            }
            dropCounter = 0;
        }

        // Hard drop
        function hardDrop() {
            while (!collide(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            updateStats();
            drop();
        }

        // Game loop
        function update(time = 0) {
            if (!gameRunning || gamePaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                drop();
            }

            drawBoard();
            drawPiece(currentPiece);

            gameLoop = requestAnimationFrame(update);
        }

        // Start game
        function startGame() {
            createBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;

            currentPiece = createPiece();
            nextPiece = createPiece();

            gameRunning = true;
            gamePaused = false;

            updateStats();
            drawNextPiece();

            document.getElementById('start-btn').disabled = true;
            document.getElementById('pause-btn').disabled = false;
            document.getElementById('game-over').classList.remove('show');

            lastTime = 0;
            dropCounter = 0;
            update();
        }

        // Pause game
        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;
            document.getElementById('pause-btn').textContent = gamePaused ? 'Resume' : 'Pause';

            if (!gamePaused) {
                lastTime = 0;
                dropCounter = 0;
                update();
            }
        }

        // Restart game
        function restartGame() {
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
            }
            startGame();
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(gameLoop);

            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').classList.add('show');
            document.getElementById('start-btn').disabled = false;
            document.getElementById('pause-btn').disabled = true;
        }

        // Keyboard controls
        document.addEventListener('keydown', event => {
            if (!gameRunning || gamePaused) {
                if (event.key === 'p' || event.key === 'P') {
                    togglePause();
                }
                return;
            }

            switch(event.key) {
                case 'ArrowLeft':
                    event.preventDefault();
                    if (!collide(currentPiece, -1, 0)) {
                        currentPiece.x--;
                    }
                    break;

                case 'ArrowRight':
                    event.preventDefault();
                    if (!collide(currentPiece, 1, 0)) {
                        currentPiece.x++;
                    }
                    break;

                case 'ArrowDown':
                    event.preventDefault();
                    if (!collide(currentPiece, 0, 1)) {
                        currentPiece.y++;
                        score += 1;
                        updateStats();
                    }
                    break;

                case 'ArrowUp':
                    event.preventDefault();
                    rotate(currentPiece);
                    break;

                case ' ':
                    event.preventDefault();
                    hardDrop();
                    break;

                case 'p':
                case 'P':
                    event.preventDefault();
                    togglePause();
                    break;
            }

            drawBoard();
            drawPiece(currentPiece);
        });

        // Initial draw
        createBoard();
        drawBoard();
    </script>
</body>
</html>
