<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe - Learn Context Engineering with AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #000;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-bottom: 2px solid #000;
            z-index: 100;
            padding: 12px 20px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
        }

        .stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
        }

        .flame {
            font-size: 20px;
            animation: pulse 2s infinite;
        }

        .hearts {
            display: flex;
            gap: 3px;
        }

        .heart {
            font-size: 18px;
            transition: all 0.3s;
        }

        .heart.lost {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Main Content */
        .container {
            max-width: 800px;
            margin: 80px auto 40px;
            padding: 20px;
        }

        /* Progress Bar */
        .lesson-progress {
            margin-bottom: 30px;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #000;
        }

        .progress-bar {
            height: 100%;
            background: #58CC02;
            transition: width 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Challenge Card */
        .challenge-card {
            background: #fff;
            border: 3px solid #000;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #000;
        }

        .challenge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .challenge-title {
            font-size: 24px;
            font-weight: 800;
        }

        .difficulty-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .difficulty-badge.beginner {
            background: #e3f2fd;
            color: #1976d2;
        }

        .difficulty-badge.intermediate {
            background: #fff3e0;
            color: #f57c00;
        }

        .difficulty-badge.advanced {
            background: #fce4ec;
            color: #c2185b;
        }

        .challenge-instruction {
            font-size: 18px;
            margin-bottom: 25px;
            color: #333;
        }

        /* Code Context */
        .code-context {
            background: #f8f8f8;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .code-context pre {
            margin: 0;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Prompt Editor */
        .prompt-editor {
            margin-bottom: 20px;
        }

        .prompt-editor label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 150px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 15px;
            border: 3px solid #000;
            border-radius: 8px;
            resize: vertical;
            transition: all 0.2s;
        }

        .prompt-textarea:focus {
            outline: none;
            border-color: #58CC02;
            box-shadow: 0 0 0 3px rgba(88, 204, 2, 0.1);
        }

        .character-count {
            text-align: right;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* AI Loading */
        .ai-loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .ai-loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #e5e5e5;
            border-top: 4px solid #58CC02;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ai-loading p {
            font-weight: 600;
            color: #666;
        }

        /* Results Panel */
        .results-panel {
            margin-top: 30px;
            padding: 25px;
            background: #f8f8f8;
            border: 2px solid #000;
            border-radius: 8px;
            display: none;
        }

        .results-panel.show {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-header h3 {
            font-size: 20px;
        }

        .score-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #58CC02;
            color: white;
            border-radius: 20px;
            font-weight: 700;
            font-size: 18px;
            animation: scoreReveal 0.5s ease-out;
        }

        .score-badge.fail {
            background: #FF4B4B;
        }

        @keyframes scoreReveal {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .ai-response-code {
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .ai-response-code pre {
            margin: 0;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .evaluation-breakdown {
            margin: 20px 0;
        }

        .evaluation-breakdown h4 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .criterion {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-weight: 600;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .criterion.passed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .criterion.failed {
            background: #ffebee;
            color: #c62828;
        }

        .check-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        .feedback-message {
            padding: 15px;
            background: #fff;
            border-left: 4px solid #58CC02;
            border-radius: 4px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        /* Drag & Drop */
        .drag-container {
            min-height: 150px;
            border: 3px dashed #000;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f8f8;
            transition: all 0.3s;
        }

        .drag-container.drag-over {
            background: #e3f2fd;
            border-color: #1976d2;
        }

        .draggable {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            cursor: grab;
            font-weight: 600;
            transition: all 0.2s;
            user-select: none;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable.dragging {
            opacity: 0.4;
            transform: scale(1.05);
        }

        .draggable.cloned {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.8;
        }

        .drop-zone {
            min-height: 120px;
            border: 3px dashed #999;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #fafafa;
            transition: all 0.3s;
        }

        .drop-zone.drag-over {
            border-color: #58CC02;
            background: #f0fff0;
        }

        .drop-zone-placeholder {
            color: #999;
            font-style: italic;
            pointer-events: none;
        }

        /* Multiple Choice */
        .options {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            padding: 18px 24px;
            border: 3px solid #000;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
            text-align: left;
        }

        .option:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }

        .option:active {
            transform: translateY(0);
        }

        .option.selected {
            background: #e3f2fd;
            border-color: #1976d2;
        }

        .option.correct {
            background: #58CC02;
            color: #fff;
            border-color: #58CC02;
            animation: bounce 0.5s;
        }

        .option.wrong {
            background: #FF4B4B;
            color: #fff;
            border-color: #FF4B4B;
            animation: shake 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Fill in the Blank */
        .sentence-builder {
            font-size: 20px;
            line-height: 2;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 12px;
            border: 2px solid #000;
        }

        .blank {
            display: inline-block;
            min-width: 100px;
            padding: 8px 16px;
            border: 2px dashed #000;
            border-radius: 8px;
            margin: 0 5px;
            background: #fff;
            min-height: 40px;
            vertical-align: middle;
            transition: all 0.3s;
        }

        .blank.drag-over {
            background: #e3f2fd;
            border-color: #1976d2;
        }

        .blank.filled {
            border-style: solid;
            background: #58CC02;
            color: #fff;
            font-weight: 700;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn {
            padding: 16px 32px;
            border: 3px solid #000;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 0 #000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-primary {
            background: #58CC02;
            color: #fff;
            border-color: #58CC02;
            box-shadow: 0 4px 0 #46a302;
        }

        .btn-primary:hover {
            background: #46a302;
        }

        .btn-primary:disabled {
            background: #ccc;
            border-color: #ccc;
            box-shadow: 0 4px 0 #999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-secondary {
            background: #fff;
            color: #000;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Feedback */
        .feedback {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: #fff;
            border-top: 3px solid #000;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 200;
        }

        .feedback.show {
            transform: translateY(0);
        }

        .feedback.correct {
            background: #58CC02;
            color: #fff;
        }

        .feedback.wrong {
            background: #FF4B4B;
            color: #fff;
        }

        .feedback-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .feedback-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-msg {
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        .xp-gain {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            font-weight: 700;
            font-size: 20px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #58CC02;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Context Window Visualizer */
        .context-window {
            border: 3px solid #000;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
        }

        .context-meter {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .context-bar {
            height: 30px;
            background: #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #000;
            position: relative;
        }

        .context-fill {
            height: 100%;
            background: linear-gradient(90deg, #58CC02 0%, #FFC800 70%, #FF4B4B 100%);
            transition: width 0.3s;
        }

        .context-label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            font-weight: 700;
            font-size: 12px;
            color: #000;
        }

        /* Celebration Screen */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(88, 204, 2, 0.95);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
        }

        .celebration.show {
            display: flex;
        }

        .celebration-content {
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .celebration-icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .celebration-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .celebration-xp {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* Hint System */
        .hint-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .hint-box.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .hint-box strong {
            display: block;
            margin-bottom: 8px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .challenge-card {
                padding: 20px;
            }

            .challenge-title {
                font-size: 20px;
            }

            .challenge-instruction {
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .stats {
                gap: 10px;
            }

            .stat {
                font-size: 14px;
            }

            .prompt-textarea {
                min-height: 120px;
                font-size: 13px;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">🎯 Vibe AI</div>
            <div class="stats">
                <div class="stat">
                    <span class="flame">🔥</span>
                    <span id="streak">0</span>
                </div>
                <div class="stat">
                    <span id="xp">0</span> XP
                </div>
                <div class="hearts" id="hearts">
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Progress -->
        <div class="lesson-progress">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Challenge Container -->
        <div id="challenge-container">
            <!-- Challenges will be dynamically loaded here -->
        </div>
    </div>

    <!-- Feedback Bar -->
    <div class="feedback" id="feedback">
        <div class="feedback-content">
            <div class="feedback-title">
                <span id="feedback-icon">✓</span>
                <span id="feedback-title-text">Correct!</span>
            </div>
            <div class="feedback-msg" id="feedback-message"></div>
            <div class="xp-gain" id="xp-display" style="display: none;">
                <span>+10 XP</span>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" id="continue-btn">Continue</button>
            </div>
        </div>
    </div>

    <!-- Celebration Screen -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-icon">🎉</div>
            <div class="celebration-title">All Lessons Complete!</div>
            <div class="celebration-xp">+50 XP Bonus</div>
            <button class="btn btn-primary" id="restart-btn">Start Over</button>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_PROXY_URL = 'http://localhost:3001/api/chat';
        const API_TIMEOUT = 15000; // 15 seconds
        const RATE_LIMIT_DELAY = 5000; // 5 seconds between requests
        const PASSING_SCORE = 50; // 50% to pass

        // ============================================
        // GAME STATE
        // ============================================
        let gameState = {
            currentLesson: 0,
            xp: parseInt(localStorage.getItem('xp')) || 0,
            streak: parseInt(localStorage.getItem('streak')) || 0,
            hearts: 5,
            totalLessons: 12,
            lastAPICall: 0,
            currentHintLevel: 0
        };

        // ============================================
        // DRAG & DROP STATE
        // ============================================
        let dragState = {
            draggedElement: null,
            cloneElement: null,
            touchStartX: 0,
            touchStartY: 0,
            currentTokens: 0,
            selectedItems: []
        };

        // ============================================
        // LESSON DATA
        // ============================================
        const lessons = [
            // LESSON 1: Multiple Choice
            {
                type: 'multipleChoice',
                title: 'What is Context Engineering?',
                instruction: 'Select the best definition:',
                options: [
                    'Writing traditional code',
                    'The art of providing the right context to AI models to solve tasks effectively',
                    'Debugging software',
                    'Designing user interfaces'
                ],
                correctIndex: 1,
                explanation: 'Perfect! Context Engineering is about carefully crafting the information you give to AI to get the best results.',
                xp: 10
            },

            // LESSON 2: Drag & Drop
            {
                type: 'dragDrop',
                title: 'Build Your First Prompt',
                instruction: 'Drag words to complete this effective prompt:',
                template: ['Create a', 'BLANK', 'that takes a', 'BLANK', 'and returns', 'BLANK'],
                wordBank: ['function', 'variable', 'class', 'number', 'string', 'doubled value', 'error', 'nothing'],
                correctAnswers: ['function', 'number', 'doubled value'],
                explanation: 'Excellent! A specific prompt with clear inputs and outputs gets better AI results.',
                xp: 15
            },

            // LESSON 3: Context Window
            {
                type: 'contextWindow',
                title: 'Context Window Challenge',
                instruction: 'You have 4096 tokens. Drag ONLY the essential context:',
                task: 'Fix this bug: "TypeError: Cannot read property \'name\' of undefined"',
                items: [
                    { text: 'Error message', tokens: 50, essential: true },
                    { text: 'Relevant code (20 lines)', tokens: 200, essential: true },
                    { text: 'Entire codebase', tokens: 5000, essential: false },
                    { text: 'What you tried', tokens: 100, essential: true },
                    { text: 'Random file', tokens: 300, essential: false }
                ],
                maxTokens: 4096,
                explanation: 'Great! You included only essential context, making the AI response faster and more accurate.',
                xp: 20
            },

            // LESSON 4: Fill in the Blank
            {
                type: 'fillBlank',
                title: 'Complete the Prompt',
                instruction: 'Fill in the blanks to make this prompt specific:',
                sentence: 'Create a BLANK component that BLANK when user BLANK',
                wordBank: ['React', 'button', 'modal', 'clicks', 'hovers', 'displays error', 'shows toast'],
                correctAnswers: ['React', 'displays error', 'clicks'],
                explanation: 'Perfect! Specific prompts with clear components, actions, and triggers work best.',
                xp: 15
            },

            // LESSON 5: Best Practices
            {
                type: 'multipleChoice',
                title: 'Best Practice Check',
                instruction: 'What makes a prompt effective?',
                options: [
                    'Being as short as possible',
                    'Using lots of technical jargon',
                    'Being specific and providing clear context',
                    'Writing in all caps'
                ],
                correctIndex: 2,
                explanation: 'Exactly! Specific prompts with clear context help AI understand exactly what you need.',
                xp: 10

        // ============================================
        // API CLIENT
        // ============================================
        async function callGroqAPI(userPrompt, systemPrompt) {
            // Rate limiting
            const now = Date.now();
            const timeSinceLastCall = now - gameState.lastAPICall;
            if (timeSinceLastCall < RATE_LIMIT_DELAY) {
                const waitTime = Math.ceil((RATE_LIMIT_DELAY - timeSinceLastCall) / 1000);
                return {
                    success: false,
                    error: `Please wait ${waitTime} seconds before trying again.`
                };
            }

            gameState.lastAPICall = now;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT);

            try {
                const response = await fetch(API_PROXY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 2048
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    return {
                        success: false,
                        error: errorData.error || `API error: ${response.status}`
                    };
                }

                const data = await response.json();
                return {
                    success: true,
                    content: data.choices[0].message.content,
                    usage: data.usage
                };
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    return {
                        success: false,
                        error: 'Request timed out. Please try again.'
                    };
                }
                return {
                    success: false,
                    error: `Connection failed: ${error.message}`
                };
            }
        }

        // ============================================
        // EVALUATION ENGINE
        // ============================================
        function evaluateAIResponse(response, criteria) {
            const results = {
                score: 0,
                maxScore: 0,
                breakdown: {},
                feedback: []
            };

            for (const [key, criterion] of Object.entries(criteria)) {
                results.maxScore += criterion.points;

                const passed = criterion.check(response);

                results.breakdown[key] = {
                    name: criterion.name || key,
                    passed: passed,
                    points: passed ? criterion.points : 0,
                    feedback: criterion.feedback
                };

                if (passed) {
                    results.score += criterion.points;
                    results.feedback.push('✓ ' + criterion.feedback);
                } else {
                    results.feedback.push('✗ ' + criterion.feedback);
                }
            }

            results.percentage = Math.round((results.score / results.maxScore) * 100);
            results.passed = results.percentage >= PASSING_SCORE;

            return results;
        }

        function init() {
            updateStats();
            loadChallenge(gameState.currentLesson);
            setupEventListeners();
        }

        function setupEventListeners() {
            document.getElementById('continue-btn').addEventListener('click', nextChallenge);
            document.getElementById('restart-btn').addEventListener('click', () => location.reload());
        }

        // ============================================
        // STATS & UI UPDATES
        // ============================================
        function updateStats() {
            document.getElementById('xp').textContent = gameState.xp;
            document.getElementById('streak').textContent = gameState.streak;
            updateHearts();
            localStorage.setItem('xp', gameState.xp);
            localStorage.setItem('streak', gameState.streak);
        }

        function updateHearts() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((heart, index) => {
                if (index >= gameState.hearts) {
                    heart.classList.add('lost');
                } else {
                    heart.classList.remove('lost');
                }
            });
        }

        // ============================================
        // CHALLENGE LOADING
        // ============================================
        function loadChallenge(index) {
            const lesson = lessons[index];
            const container = document.getElementById('challenge-container');
            const progress = (index / gameState.totalLessons) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            // Reset state
            dragState.currentTokens = 0;
            dragState.selectedItems = [];
            gameState.currentHintLevel = 0;

            let html = '<div class="challenge-card">';

            // Header with difficulty badge for AI challenges
            if (lesson.type === 'aiChallenge') {
                html += `
                    <div class="challenge-header">
                        <div class="challenge-title">${lesson.title}</div>
                        <span class="difficulty-badge ${lesson.difficulty}">${lesson.difficulty}</span>
                    </div>
                `;
            } else {
                html += `<div class="challenge-title">${lesson.title}</div>`;
            }

            html += `<div class="challenge-instruction">${lesson.instruction}</div>`;

            // Render based on type
            switch(lesson.type) {
                case 'multipleChoice':
                    html += renderMultipleChoice(lesson);
                    break;
                case 'dragDrop':
                    html += renderDragDrop(lesson);
                    break;
                case 'contextWindow':
                    html += renderContextWindow(lesson);
                    break;
                case 'fillBlank':
                    html += renderFillBlank(lesson);
                    break;
                case 'aiChallenge':
                    html += renderAIChallenge(lesson);
                    break;
            }

            html += '</div>';
            container.innerHTML = html;

            // Initialize based on type
            setTimeout(() => {
                if (lesson.type === 'dragDrop' || lesson.type === 'contextWindow' || lesson.type === 'fillBlank') {
                    initDragDrop();
                } else if (lesson.type === 'multipleChoice') {
                    initMultipleChoice(lesson);
                } else if (lesson.type === 'aiChallenge') {
                    initAIChallenge(lesson);
                }
            }, 100);
        }

        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        function renderMultipleChoice(lesson) {
            let html = '<div class="options">';
            lesson.options.forEach((option, index) => {
                html += `<div class="option" data-option-index="${index}">${option}</div>`;
            });
            html += '</div>';
            return html;
        }

        function renderDragDrop(lesson) {
            let html = '<div class="sentence-builder">';
            lesson.template.forEach((word, index) => {
                if (word === 'BLANK') {
                    html += `<span class="blank" data-blank-index="${index}"></span>`;
                } else {
                    html += `<span>${word}</span>`;
                }
            });
            html += '</div><div class="word-bank">';
            lesson.wordBank.forEach((word) => {
                html += `<div class="draggable" data-word="${word}">${word}</div>`;
            });
            html += '</div><div class="button-group"><button class="btn btn-primary" id="check-btn">Check Answer</button></div>';
            return html;
        }

            let html = `
                <div class="context-window">
                    <div class="context-meter">

                        <span id="token-count">0 / ${lesson.maxTokens} tokens</span>

                html += `<div class="draggable" data-item-index="${index}" data-tokens="${item.tokens}" data-essential="${item.essential}">${item.text} <small>(${item.tokens} tokens)</small></div>`;
            });
            html += '</div><div class="button-group"><button class="btn btn-primary" id="check-btn">Check Answer</button></div>';
            return html;

        function renderFillBlank(lesson) {
            const parts = lesson.sentence.split('BLANK');
            let html = '<div class="sentence-builder">';
            parts.forEach((part, index) => {
                html += `<span>${part}</span>`;
                if (index < parts.length - 1) {
                    html += `<span class="blank" data-blank-index="${index}"></span>`;
                }
            });
            html += '</div><div class="word-bank">';
            lesson.wordBank.forEach((word) => {
                html += `<div class="draggable" data-word="${word}">${word}</div>`;
            });
            html += '</div><div class="button-group"><button class="btn btn-primary" id="check-btn">Check Answer</button></div>';
            return html;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;

        // ============================================
        // INITIALIZE HANDLERS
        // ============================================
        function initMultipleChoice(lesson) {
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.addEventListener('click', function() {
                    const selectedIndex = parseInt(this.dataset.optionIndex);
                    selectOption(selectedIndex, lesson.correctIndex);
                });
            });
        }

        function initDragDrop() {
            const draggables = document.querySelectorAll('.draggable');
            const blanks = document.querySelectorAll('.blank');
            const dropZone = document.getElementById('drop-zone');
            const checkBtn = document.getElementById('check-btn');

            draggables.forEach(item => {
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
                item.addEventListener('touchstart', handleTouchStart, { passive: false });
                item.addEventListener('touchmove', handleTouchMove, { passive: false });
                item.addEventListener('touchend', handleTouchEnd);
            });

            blanks.forEach(blank => {
                blank.addEventListener('dragover', handleDragOver);
                blank.addEventListener('drop', handleDrop);
                blank.addEventListener('dragleave', handleDragLeave);
            });

            if (dropZone) {
                dropZone.addEventListener('dragover', handleDragOver);
                dropZone.addEventListener('drop', handleDropContext);
                dropZone.addEventListener('dragleave', handleDragLeave);
            }

            if (checkBtn) {
                const lesson = lessons[gameState.currentLesson];
                checkBtn.addEventListener('click', () => {
                    if (lesson.type === 'dragDrop') {
                        checkDragDropAnswer();
                    } else if (lesson.type === 'contextWindow') {
                        checkContextAnswer();
                    } else if (lesson.type === 'fillBlank') {
                        checkFillBlankAnswer();
                    }
                });
            }
        }

        function initAIChallenge(lesson) {
            const testBtn = document.getElementById('test-ai-btn');
            const hintBtn = document.getElementById('hint-btn');
            const retryBtn = document.getElementById('retry-btn');
            const promptTextarea = document.getElementById('user-prompt');
            const charCount = document.getElementById('char-count');

            // Character counter
            promptTextarea.addEventListener('input', () => {
                const length = promptTextarea.value.length;
                charCount.textContent = `${length} / 1000 characters`;
            });

            // Test button
            testBtn.addEventListener('click', async () => {
                const userPrompt = promptTextarea.value.trim();

                if (!userPrompt) {
                    alert('Please write a prompt first!');
                    return;
                }

                // Show loading
                document.getElementById('ai-loading').classList.add('show');
                document.getElementById('results-panel').classList.remove('show');
                testBtn.disabled = true;
                hintBtn.disabled = true;

                // Call API
                const aiResult = await callGroqAPI(userPrompt, lesson.systemPrompt);

                // Hide loading
                document.getElementById('ai-loading').classList.remove('show');

                if (!aiResult.success) {
                    alert(`Error: ${aiResult.error}`);
                    testBtn.disabled = false;
                    hintBtn.disabled = false;
                    return;
                }

                // Evaluate response
                const evaluation = evaluateAIResponse(aiResult.content, lesson.evaluationCriteria);

                // Display results
                displayAIResults(evaluation, aiResult.content);

                // Show feedback
                if (evaluation.passed) {
                    gameState.xp += lesson.xp;
                    updateStats();
                    showFeedback(true, lesson.explanation || 'Great job! Your prompt worked well.');
                } else {
                    loseHeart();
                    showFeedback(false, `Score: ${evaluation.percentage}%. You need ${PASSING_SCORE}% to pass. Try improving your prompt!`);
                }

                // Enable retry
                testBtn.disabled = false;
                hintBtn.disabled = false;
                retryBtn.style.display = 'inline-flex';
            });

            // Hint button
            hintBtn.addEventListener('click', () => {
                const hintBox = document.getElementById('hint-box');
                if (gameState.currentHintLevel < lesson.hints.length) {
                    const hint = lesson.hints[gameState.currentHintLevel];
                    hintBox.innerHTML = `<strong>Hint ${gameState.currentHintLevel + 1}:</strong> ${hint}`;
                    hintBox.classList.add('show');
                    gameState.currentHintLevel++;
                } else {
                    hintBox.innerHTML = `<strong>Example Prompt:</strong><br>${lesson.exampleGood}`;
                    hintBox.classList.add('show');
                }
            });

            // Retry button
            retryBtn.addEventListener('click', () => {
                document.getElementById('results-panel').classList.remove('show');
                retryBtn.style.display = 'none';
                promptTextarea.focus();
            });
        }

        function displayAIResults(evaluation, aiResponse) {
            const resultsPanel = document.getElementById('results-panel');

            let html = `
                <div class="results-header">
                    <h3>AI Response</h3>
                    <span class="score-badge ${evaluation.passed ? '' : 'fail'}">${evaluation.score}/${evaluation.maxScore} (${evaluation.percentage}%)</span>
                </div>

                <div class="ai-response-code">
                    <pre><code>${escapeHtml(aiResponse)}</code></pre>
                </div>

                <div class="evaluation-breakdown">
                    <h4>Evaluation Breakdown</h4>
            `;

            for (const [key, result] of Object.entries(evaluation.breakdown)) {
                html += `
                    <div class="criterion ${result.passed ? 'passed' : 'failed'}">
                        <span class="check-icon">${result.passed ? '✓' : '✗'}</span>
                        <span>${result.name} (${result.points}/${result.points})</span>
                    </div>
                `;
            }

            html += '</div>';

            if (evaluation.passed) {
                html += `<div class="feedback-message">✅ Great job! Your prompt successfully generated the required code.</div>`;
            } else {
                html += `<div class="feedback-message">⚠️ Your prompt needs improvement. Review the failed criteria and try again!</div>`;
            }

            resultsPanel.innerHTML = html;
            resultsPanel.classList.add('show');
        }

        // ============================================
        // DRAG & DROP HANDLERS
        // ============================================
        function handleDragStart(e) {
            dragState.draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.preventDefault();
            this.classList.remove('drag-over');

            if (dragState.draggedElement && this.classList.contains('blank')) {
                const word = dragState.draggedElement.dataset.word;
                this.textContent = word;
                this.classList.add('filled');
                dragState.draggedElement.remove();
            }

            return false;
        }

        function handleDropContext(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.preventDefault();
            this.classList.remove('drag-over');

            if (dragState.draggedElement) {
                const tokens = parseInt(dragState.draggedElement.dataset.tokens || 0);
                const essential = dragState.draggedElement.dataset.essential === 'true';
                const index = parseInt(dragState.draggedElement.dataset.itemIndex || 0);
                const lesson = lessons[gameState.currentLesson];

                if (dragState.currentTokens + tokens <= lesson.maxTokens) {
                    dragState.currentTokens += tokens;
                    dragState.selectedItems.push({ index, essential });

                    const placeholder = this.querySelector('.drop-zone-placeholder');
                    if (placeholder) placeholder.remove();

                    const clone = dragState.draggedElement.cloneNode(true);
                    clone.setAttribute('draggable', 'false');
                    this.appendChild(clone);
                    dragState.draggedElement.remove();

                    updateContextMeter();
                }
            }

            return false;
        }

        function handleTouchStart(e) {
            dragState.draggedElement = this;
            this.classList.add('dragging');

            const touch = e.touches[0];
            dragState.touchStartX = touch.clientX;
            dragState.touchStartY = touch.clientY;

            dragState.cloneElement = this.cloneNode(true);
            dragState.cloneElement.classList.add('cloned');
            dragState.cloneElement.style.left = touch.clientX + 'px';
            dragState.cloneElement.style.top = touch.clientY + 'px';
            document.body.appendChild(dragState.cloneElement);

            e.preventDefault();
        }

        function handleTouchMove(e) {
            if (!dragState.draggedElement || !dragState.cloneElement) return;

            const touch = e.touches[0];
            dragState.cloneElement.style.left = touch.clientX - 50 + 'px';
            dragState.cloneElement.style.top = touch.clientY - 20 + 'px';

            e.preventDefault();
        }

        function handleTouchEnd(e) {
            if (!dragState.draggedElement) return;

            const touch = e.changedTouches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);

            if (element && element.classList.contains('blank')) {
                const word = dragState.draggedElement.dataset.word;
                element.textContent = word;
                element.classList.add('filled');
                dragState.draggedElement.remove();
            } else if (element && (element.classList.contains('drop-zone') || element.closest('.drop-zone'))) {
                const dropZone = element.classList.contains('drop-zone') ? element : element.closest('.drop-zone');
                const tokens = parseInt(dragState.draggedElement.dataset.tokens || 0);
                const essential = dragState.draggedElement.dataset.essential === 'true';
                const index = parseInt(dragState.draggedElement.dataset.itemIndex || 0);
                const lesson = lessons[gameState.currentLesson];

                if (lesson.type === 'contextWindow' && dragState.currentTokens + tokens <= lesson.maxTokens) {
                    dragState.currentTokens += tokens;
                    dragState.selectedItems.push({ index, essential });

                    const placeholder = dropZone.querySelector('.drop-zone-placeholder');
                    if (placeholder) placeholder.remove();

                    const clone = dragState.draggedElement.cloneNode(true);
                    clone.setAttribute('draggable', 'false');
                    dropZone.appendChild(clone);
                    dragState.draggedElement.remove();

                    updateContextMeter();
                }
            }

            this.classList.remove('dragging');
            if (dragState.cloneElement) {
                dragState.cloneElement.remove();
                dragState.cloneElement = null;
            }
            dragState.draggedElement = null;
        }

        function updateContextMeter() {
            const lesson = lessons[gameState.currentLesson];
            const percentage = (dragState.currentTokens / lesson.maxTokens) * 100;
            document.getElementById('token-count').textContent = `${dragState.currentTokens} / ${lesson.maxTokens} tokens`;
            document.getElementById('context-fill').style.width = percentage + '%';
        }

        // ============================================
        // ANSWER CHECKING
        // ============================================
        function selectOption(selectedIndex, correctIndex) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.style.pointerEvents = 'none');

            if (selectedIndex === correctIndex) {
                options[selectedIndex].classList.add('correct');
                showFeedback(true, lessons[gameState.currentLesson].explanation);
            } else {
                options[selectedIndex].classList.add('wrong');
                options[correctIndex].classList.add('correct');
                loseHeart();
                showFeedback(false, 'Not quite! ' + lessons[gameState.currentLesson].explanation);
            }
        }

        function checkDragDropAnswer() {
            const lesson = lessons[gameState.currentLesson];
            const blanks = document.querySelectorAll('.blank');
            let correct = true;

            blanks.forEach((blank, index) => {
                if (blank.textContent !== lesson.correctAnswers[index]) {
                    correct = false;
                }
            });

            if (correct) {
                showFeedback(true, lesson.explanation);
            } else {
                loseHeart();
                showFeedback(false, 'Try again! ' + lesson.explanation);
            }
        }

        function checkContextAnswer() {
            const lesson = lessons[gameState.currentLesson];
            const allEssential = dragState.selectedItems.every(item => item.essential);
            const hasAllEssential = lesson.items.filter(item => item.essential).every(item =>
                dragState.selectedItems.some(selected => selected.index === lesson.items.indexOf(item))
            );

            if (allEssential && hasAllEssential) {
                showFeedback(true, lesson.explanation);
            } else {
                loseHeart();
                showFeedback(false, 'Not quite! Make sure to include ALL essential context and exclude non-essential items.');
            }
        }

        function checkFillBlankAnswer() {
            const lesson = lessons[gameState.currentLesson];
            const blanks = document.querySelectorAll('.blank');
            let correct = true;

            blanks.forEach((blank, index) => {
                if (blank.textContent !== lesson.correctAnswers[index]) {
                    correct = false;
                }
            });

            if (correct) {
                showFeedback(true, lesson.explanation);
            } else {
                loseHeart();
                showFeedback(false, 'Try again! Think about what makes the prompt most specific.');
            }
        }

        // ============================================
        // FEEDBACK & NAVIGATION
        // ============================================
        function showFeedback(isCorrect, message) {
            const feedback = document.getElementById('feedback');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title-text');
            const msg = document.getElementById('feedback-message');
            const xpDisplay = document.getElementById('xp-display');

            feedback.classList.remove('correct', 'wrong');

            if (isCorrect) {
                feedback.classList.add('correct');
                icon.textContent = '✓';
                title.textContent = 'Amazing!';
                msg.textContent = message;

                const lesson = lessons[gameState.currentLesson];
                gameState.xp += lesson.xp;
                updateStats();

                xpDisplay.textContent = `+${lesson.xp} XP`;
                xpDisplay.style.display = 'inline-flex';

                createConfetti();
            } else {
                feedback.classList.add('wrong');
                icon.textContent = '✗';
                title.textContent = 'Not quite!';
                msg.textContent = message;
                xpDisplay.style.display = 'none';
            }

            feedback.classList.add('show');
        }

        function loseHeart() {
            if (gameState.hearts > 0) {
                gameState.hearts--;
                updateHearts();
            }
        }

        function nextChallenge() {
            document.getElementById('feedback').classList.remove('show');

            gameState.currentLesson++;

            if (gameState.currentLesson >= gameState.totalLessons) {
                showCelebration();
            } else {
                setTimeout(() => {
                    loadChallenge(gameState.currentLesson);
                }, 300);
            }
        }

        function showCelebration() {
            gameState.xp += 50;
            gameState.streak++;
            updateStats();

            document.getElementById('celebration').classList.add('show');
            createConfetti(50);
        }

        function createConfetti(count = 20) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = ['#58CC02', '#FFC800', '#FF4B4B', '#1CB0F6'][Math.floor(Math.random() * 4)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }

        // ============================================
        // START GAME
        // ============================================
        init();
    </script>
</body>
</html>
