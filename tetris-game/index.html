<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>TETRIS</h1>
        </div>

        <div class="game-content">
            <div class="game-info left-panel">
                <div class="info-box">
                    <h3>Next Piece</h3>
                    <canvas id="next-piece-canvas" width="120" height="120"></canvas>
                </div>
                <div class="info-box">
                    <h3>Controls</h3>
                    <div class="controls">
                        <p><strong>←/→</strong> Move</p>
                        <p><strong>↓</strong> Soft Drop</p>
                        <p><strong>Space</strong> Hard Drop</p>
                        <p><strong>↑</strong> Rotate</p>
                        <p><strong>P</strong> Pause</p>
                    </div>
                </div>
            </div>

            <div class="game-board">
                <canvas id="game-canvas" width="300" height="600"></canvas>
                <div id="game-over-overlay" class="game-over-overlay hidden">
                    <div class="game-over-content">
                        <h2>GAME OVER</h2>
                        <p class="final-score">Score: <span id="final-score">0</span></p>
                        <button id="restart-button">Play Again</button>
                    </div>
                </div>
            </div>

            <div class="game-info right-panel">
                <div class="info-box">
                    <h3>Score</h3>
                    <p class="score-value" id="score">0</p>
                </div>
                <div class="info-box">
                    <h3>Level</h3>
                    <p class="level-value" id="level">1</p>
                </div>
                <div class="info-box">
                    <h3>Lines</h3>
                    <p class="lines-value" id="lines">0</p>
                </div>
                <div class="info-box">
                    <button id="start-button" class="control-button">Start Game</button>
                    <button id="pause-button" class="control-button" disabled>Pause</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
